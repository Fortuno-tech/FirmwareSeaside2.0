<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SmartCount</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />

    <style></style>
  </head>

  <body>
    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <i class="bi bi-cpu-fill"></i>
        <span>SmartCount</span>
      </div>

      <nav class="menu">
        <a class="active" onclick="showPage('dashboard', this)">
          <i class="bi bi-speedometer2"></i>
          Tableau de board
        </a>

        <a onclick="showPage('reseaux', this)">
          <i class="bi bi-wifi"></i>
          Réseaux
        </a>

        <a onclick="showPage('module', this)">
          <i class="bi bi-hdd-network"></i>
          Module
        </a>

        <a onclick="showPage('parametre', this)">
          <i class="bi bi-gear-fill"></i>
          Paramètre
        </a>
      </nav>
    </aside>

    <!-- ================= MAIN ================= -->
    <main class="main">
      <!-- TOPBAR -->
      <div class="topbar">
        <div class="burger" onclick="toggleSidebar()">
          <i class="bi bi-list"></i>
        </div>

        <h1 id="pageTitle">Tableau de board</h1>
      </div>

      <!-- ================= DASHBOARD ================= -->
      <section class="page active" id="dashboard">
        <div class="cards">
          <!-- PASSAGE -->
          <div class="card">
            <div class="card-top">
              <div>
                <p>Passage Total</p>
                <h2 id="passageCount">50</h2>
                <div style="margin-top: 15px; display: flex; gap: 10px">
                    <button class="counter-btn decrement" onclick="decrementPassage()">
                        <i class="bi bi-dash-lg"></i>
                    </button>

                    <button class="counter-btn increment" onclick="incrementPassage()">
                    <i class="bi bi-plus-lg"></i>
                    </button>
                </div>
              </div>

              <div class="card-icon blue">
                <i class="bi bi-people-fill"></i>
              </div>
            </div>
          </div>

          <!-- MODE -->
          <div class="card">
            <div class="card-top">
              <div>
                <p>Mode</p>
                <h2>Hors ligne</h2>
              </div>

              <div class="card-icon green">
                <i class="bi bi-wifi"></i>
              </div>
            </div>
          </div>

          <!-- BATTERIE -->
          <div class="card">
            <div class="card-top">
              <div>
                <p>Batterie</p>
                <h2>100%</h2>
              </div>

              <div class="card-icon orange">
                <i class="bi bi-battery-full"></i>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ================= RESEAUX ================= -->
      <section class="page" id="reseaux">
        <div class="form-box">
          <h3>
            <i class="bi bi-wifi"></i>
            Configuration Réseaux
          </h3>

          <!-- MODE -->
          <form onsubmit="submit_reseau()">
            <div class="input-group">
                <label>
                <i class="bi bi-diagram-3"></i>
                Choisir le mode
                </label>

                <select id="modeNet" onchange="changeNetworkMode()">
                <option value="ap">Point d'accès</option>
                <option value="online">En ligne</option>
                </select>
            </div>

            <!-- DYNAMIC FORM -->
            <div id="networkArea"></div>
            </div>
        </form>
      </section>

      <!-- ================= MODULE ================= -->
      <section class="page" id="module">
        <div class="form-box">
          <h3>
            <i class="bi bi-hdd-network"></i>
            Configuration Module
          </h3>

          <form id="moduleForm">
            <!-- TYPE -->
            <div class="input-group">
              <label>
                <i class="bi bi-diagram-3"></i>
                Type Module
              </label>

              <select id="typeModule">
                <option>Master</option>
                <option>Slave</option>
              </select>
            </div>

            <!-- MAC -->
            <div class="input-group">
              <label>
                <i class="bi bi-cpu"></i>
                Adresse MAC
              </label>

              <input
                type="text"
                id="mac1"
                placeholder="AA:BB:CC:DD:EE:FF"
                required
              />
            </div>

            <!-- AUTRE MODULE -->
            <div class="input-group">
              <label>
                <i class="bi bi-cpu-fill"></i>
                MAC autre module
              </label>

              <input
                type="text"
                id="mac2"
                placeholder="11:22:33:44:55:66"
                required
              />
            </div>

            <button class="btn">
              <i class="bi bi-check-circle"></i>
              Confirmer
            </button>
          </form>
        </div>

        <!-- MODULE LIST -->
        <div class="module-list" id="moduleList"></div>
      </section>

      <!-- ================= PARAMETRE ================= -->
      <section class="page" id="parametre">
        <div class="form-box">
          <h3>
            <i class="bi bi-gear-fill"></i>
            Paramètre
          </h3>

          <p style="color: #64748b">Cette page est vide pour le moment.</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
```
